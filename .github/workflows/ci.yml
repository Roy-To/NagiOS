name: Nagi CI

on:
  push:
    paths-ignore:
      - '.dev/workstreams/**/state.json'
  pull_request:
    paths-ignore:
      - '.dev/workstreams/**/state.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  change-scope:
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Regression tests for change scope and required files
        run: python3 -m unittest discover -s tests -p 'test_ci_change_scope.py' -v
      - name: Verify required repository files
        shell: bash
        run: |
          # Keep aligned with check_repository_layout in tools/nagi-cli/src/commands.rs.
          required=(
            Cargo.toml
            Cargo.lock
            AGENTS.md
            docs/Nagi_OS_0.1_Codex_Implementation_Spec.md
            docs/implementation_status.md
          )
          missing=false
          for path in "${required[@]}"; do
            if [ ! -f "$path" ]; then
              echo "::error::Missing required repository file: $path"
              missing=true
            fi
          done
          if [ "$missing" = true ]; then
            exit 1
          fi
      - id: scope
        name: Classify changed files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$base"
          changed_files=$(git diff --name-only --no-renames "$base" "$HEAD_SHA")
          if [ -z "$changed_files" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docs_only=true
          while IFS= read -r path; do
            if [[ ! "$path" =~ ^docs/.*\.md$ && ! "$path" =~ ^[^/]+\.md$ ]]; then
              docs_only=false
              break
            fi
          done <<< "$changed_files"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  ubuntu-host:
    needs: change-scope
    if: needs.change-scope.outputs.docs_only != 'true'
    concurrency:
      group: nagi-ci-ubuntu-host-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install supported host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang clang-19 lld lld-19 qemu-system-x86 ovmf cmake meson ninja-build python3
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-19 190
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-19 190
          sudo update-alternatives --install /usr/bin/lld lld /usr/bin/lld-19 190
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install nightly-2025-08-01 --profile minimal --component rustfmt --component clippy --component rust-src
      - name: Bootstrap pinned host fonts and source metadata
        run: cargo run --locked --manifest-path tools/nagi-bootstrap/Cargo.toml -p nagi-bootstrap -- fetch
      - name: Format
        run: |
          cargo fmt --package nagi-cli --package nagi-idl --package nagi-abi --package nagi-model --package nagi-i18n --package nagi-ui --package nagi-localization --package libnagi --package nagi-net --package nagi-pal --package nagi-posix --package nagi-audio --package nagi-history --package nagi-model-manager --package nagi-search --package nagi-ai --package nagi-init --package nagi-package --package nagi-sdk --package nagi-isolated-app --package nagi-search-ipc --package nagi-action-ipc -- --check
          cargo fmt --manifest-path tools/nagi-pkg/Cargo.toml -- --check
          rustfmt --check user/nagi-albert/src/lib.rs
      - name: Regression tests for CI diagnostic parsers
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Linux development image acceptance helper tests (host-only)
        run: |
          python3 -m unittest discover -s tools/linux-boot/notes-desktop-dev-20261116 -p 'test_persistence_kernel_preflight.py' -v
          python3 -m unittest discover -s tools/linux-boot/notes-desktop-dev-20261116 -p 'test_persistence_acceptance_runner.py' -v
          python3 -m unittest discover -s tools/linux-boot/notes-desktop-dev-20261116 -p 'test_qmp_socket_path.py' -v
          python3 -m unittest discover -s tools/linux-boot -p 'test_run_qemu_child.py' -v
          python3 -m unittest discover -s tools/linux-boot -p 'test_run_dev_image.py' -v
          python3 -m unittest discover -s tools/linux-boot -p 'test_calendar_l10_acceptance.py' -v
          python3 -m unittest discover -s tools/linux-boot -p 'test_task24_rfb_automatic.py' -v
      - name: Lint host-compatible workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build host-compatible workspace
        run: cargo build --workspace --locked
      - name: Prepare and verify standalone Legal before offline CLI delegation
        run: |
          cargo fmt --manifest-path tools/legal/Cargo.toml --all -- --check
          cargo clippy --manifest-path tools/legal/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path tools/legal/Cargo.toml --locked --offline
      - name: Test host-compatible workspace
        run: |
          cargo test --manifest-path crates/nagi-system-principal-contract/Cargo.toml --locked
          # These exact cases require real clone3 or root-owned markers.
          # The next required step runs every listed case in a diskless guest.
          mapfile -t guest_only < <(python3 -c 'import json; from pathlib import Path; print(*json.loads(Path("tools/linux-boot/live_pid1_ci_tests.json").read_text()), sep=chr(10))')
          test "${#guest_only[@]}" -eq 25
          host_args=(--exact)
          for test_name in "${guest_only[@]}"; do host_args+=(--skip "$test_name"); done
          CODEC_CANDIDATE_TMP=$(mktemp -d "$RUNNER_TEMP/nagi-notes-codec.XXXXXX")
          export CODEC_CANDIDATE_TMP
          cargo test --workspace --locked -- "${host_args[@]}"
      - name: Required Linux PID1 lifecycle tests in diskless QEMU
        run: |
          mkdir -p out/logs/linux-pid1-inputs
          inputs=out/logs/linux-pid1-inputs
          rustup target add --toolchain nightly-2025-08-01 x86_64-unknown-linux-musl
          sysroot=$(rustc +nightly-2025-08-01 --print sysroot)
          rust_lld="$sysroot/lib/rustlib/x86_64-unknown-linux-gnu/bin/rust-lld"
          test -x "$rust_lld"
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER="$rust_lld"
          cargo +nightly-2025-08-01 test -p nagi-init --locked --target x86_64-unknown-linux-musl --no-run --message-format=json > "$inputs/test-build.jsonl"
          test_elf=$(python3 -c 'import json,sys; xs=[r["executable"] for r in map(json.loads,sys.stdin) if r.get("reason")=="compiler-artifact" and r.get("executable") and r.get("target",{}).get("name")=="nagi-init" and r.get("profile",{}).get("test") is True]; assert len(xs)==1; print(xs[0])' < "$inputs/test-build.jsonl")
          rustc +nightly-2025-08-01 --edition 2021 --target x86_64-unknown-linux-musl -C linker="$rust_lld" -o "$inputs/init" tools/linux-boot/live_pid1_ci_init.rs
          # Read the preinstalled runner kernel, but never run the Rust
          # tests with sudo or change runner namespace/security settings.
          runner_kernel="/boot/vmlinuz-$(uname -r)"
          sudo cat "$runner_kernel" > "$inputs/kernel"
          python3 -B tools/linux-boot/run_live_pid1_ci.py --kernel "$inputs/kernel" --test-elf "$test_elf" --init-elf "$inputs/init" --manifest tools/linux-boot/live_pid1_ci_tests.json --output-dir out/logs/linux-pid1-live --timeout-seconds 240
      - name: Compile Linux Calendar PID 1 integration and tests
        run: |
          export RUSTFLAGS='--cfg linux_boot_identity_runtime --cfg linux_boot_owner_registration --cfg linux_task24_owner_co_location --cfg linux_task24_initial_login_runtime --cfg linux_task24_notes_consumer --cfg linux_dev_ws10 --cfg linux_dev_notes_performance --cfg linux_dev_system_mount --cfg linux_task24_desktop_shell --cfg linux_task24_settings --cfg linux_task24_calendar_app'
          cargo +nightly-2025-08-01 fetch --manifest-path user/nagi-init/Cargo.toml --locked --target x86_64-unknown-linux-musl
          cargo +nightly-2025-08-01 check --manifest-path user/nagi-init/Cargo.toml --locked --offline --target x86_64-unknown-linux-musl --no-default-features --features linux-service-action-bridge,m10-desktop,desktop-login,system-service-readiness,production-session --bin nagi-init
          cargo +nightly-2025-08-01 check --manifest-path user/nagi-init/Cargo.toml --locked --offline --target x86_64-unknown-linux-musl --no-default-features --features linux-service-action-bridge,m10-desktop,desktop-login,system-service-readiness,production-session --bin nagi-init --tests
      - name: Files host and Linux session consumer contracts
        run: |
          cargo test --manifest-path apps/nagi-files/Cargo.toml --locked
          cargo check --manifest-path tools/nagi-files-c1-session-consumer/Cargo.toml --locked \
            --target x86_64-unknown-linux-musl --features c1-issued-session
          CODEC_CANDIDATE_TMP=$(mktemp -d "$RUNNER_TEMP/nagi-notes-codec.XXXXXX")
          export CODEC_CANDIDATE_TMP
          trap 'rm -rf "$CODEC_CANDIDATE_TMP"' EXIT
          cargo test --manifest-path tools/linux-boot/notes-desktop-dev-20261116/notes-codec/Cargo.toml --locked
      - name: Standalone installer format, lint, and tests
        run: |
          cargo fmt --manifest-path tools/nagi-installer/Cargo.toml -- --check
          cargo clippy --manifest-path tools/nagi-installer/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path tools/nagi-installer/Cargo.toml --locked
      - name: Standalone clipboard core (CLIP-01)
        run: |
          cargo fmt --manifest-path crates/nagi-clipboard-core/Cargo.toml -- --check
          cargo clippy --manifest-path crates/nagi-clipboard-core/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path crates/nagi-clipboard-core/Cargo.toml --locked
      - name: Standalone search core (SEARCH-CORE-01)
        run: |
          cargo fmt --manifest-path crates/nagi-search-core/Cargo.toml -- --check
          cargo clippy --manifest-path crates/nagi-search-core/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path crates/nagi-search-core/Cargo.toml --locked
      - name: Focused host acceptance (M0)
        run: ./nagi test --acceptance --host-only --ci
      - name: Upload Ubuntu acceptance reports and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-ubuntu-host-${{ github.run_attempt }}
          path: |
            out/test-results/
            out/logs/acceptance/
            out/logs/linux-pid1-live/serial.log
            out/logs/linux-pid1-live/supervisor.log
            out/logs/linux-pid1-live/result.json
            out/logs/linux-pid1-live/failure.json
          if-no-files-found: ignore
      - name: Verify development workstream state
        run: ./nagi dev verify
      - name: Test Albert browser state and input adapters
        run: cargo test --locked -p nagi-albert-linux-tests
      - name: M0 doctor acceptance
        run: ./tests/acceptance/m0_doctor.sh
      - name: M0 launcher acceptance
        run: ./tests/acceptance/m0_launcher.sh
  task24-release-dev-entry-gate:
    needs: change-scope
    if: needs.change-scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain and Linux musl target
        run: |
          rustup toolchain install nightly-2025-08-01 --profile minimal
          rustup target add --toolchain nightly-2025-08-01 x86_64-unknown-linux-musl
      - name: Verify release ELF excludes all Task24 development entry markers
        run: |
          mkdir -p out/logs
          NAGI_LINUX_BOOT_CATALOG_PUBLIC_KEY=$(mktemp "$RUNNER_TEMP/task24-catalog.XXXXXX")
          # RFC 8032 test vector public key. The gate needs populated trust
          # inputs, and the test digest does not authorize any real package.
          python3 -c 'import sys; from pathlib import Path; Path(sys.argv[1]).write_bytes(bytes.fromhex("d75a980182b10ab7d54bfed3c964073a0ee172f3daa62325af021a68f707511a"))' "$NAGI_LINUX_BOOT_CATALOG_PUBLIC_KEY"
          read -r NAGI_LINUX_DEV_LOGIN_PACKAGE_SHA256 _ < <(printf %s 'Task24 build-only fixture' | sha256sum)
          export NAGI_LINUX_BOOT_CATALOG_PUBLIC_KEY NAGI_LINUX_DEV_LOGIN_PACKAGE_SHA256
          tools/linux-boot/build_task24_acceptance_elf.sh --online --release out/logs/task24-release-elf
      - name: Upload release gate receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: task24-release-elf-receipt-${{ github.run_attempt }}
          path: out/logs/task24-release-elf/build-receipt.json
          if-no-files-found: error
  windows-launcher:
    needs: change-scope
    if: needs.change-scope.outputs.docs_only != 'true'
    concurrency:
      group: nagi-ci-windows-launcher-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 30
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install nightly-2025-08-01 --profile minimal --component rustfmt --component clippy --component rust-src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bootstrap pinned host fonts and source metadata
        shell: pwsh
        run: |
          cargo run --locked --manifest-path tools/nagi-bootstrap/Cargo.toml -p nagi-bootstrap -- fetch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build host-compatible workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --workspace --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare and verify standalone Legal before offline CLI delegation
        shell: pwsh
        run: |
          cargo fmt --manifest-path tools/legal/Cargo.toml --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path tools/legal/Cargo.toml --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path tools/legal/Cargo.toml --locked --offline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test host-compatible workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CODEC_CANDIDATE_TMP = Join-Path $env:RUNNER_TEMP ('nagi-notes-codec-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $env:CODEC_CANDIDATE_TMP | Out-Null
          cargo test --workspace --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Standalone installer format, lint, and tests (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fmt --manifest-path tools/nagi-installer/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path tools/nagi-installer/Cargo.toml --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path tools/nagi-installer/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows launcher help
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\nagi.ps1 --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify truthful missing-dependency mode
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\nagi.ps1 doctor --allow-missing
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Focused Windows host acceptance (M0 launcher)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\nagi.ps1 test --acceptance --host-only --subsystem developer-cli --ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify development workstream state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\nagi.ps1 dev verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows acceptance reports and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-windows-host-${{ github.run_attempt }}
          path: |
            out/test-results/
            out/logs/acceptance/
          if-no-files-found: ignore
