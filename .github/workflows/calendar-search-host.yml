name: Calendar Search host contracts

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/calendar-search-host.yml
      - Cargo.toml
      - Cargo.lock
      - crates/nagi-model/**
      - crates/nagi-calendar-core/**
      - crates/nagi-calendar-search-adapter/**
      - crates/nagi-search-core/**
      - tests/search-core/**
      - user/nagi-search/**
  push:
    branches: [main]
    paths:
      - .github/workflows/calendar-search-host.yml
      - Cargo.toml
      - Cargo.lock
      - crates/nagi-model/**
      - crates/nagi-calendar-core/**
      - crates/nagi-calendar-search-adapter/**
      - crates/nagi-search-core/**
      - tests/search-core/**
      - user/nagi-search/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calendar-search-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: 1
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Calendar Search adapter
            manifest: crates/nagi-calendar-search-adapter/Cargo.toml
            package: nagi-calendar-search-adapter
          - name: Pinned SearchCore graph
            manifest: crates/nagi-search-core/Cargo.toml
            package: nagi-search-core
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install pinned host toolchain
        run: rustup toolchain install nightly-2025-08-01 --profile minimal --component rustfmt --component clippy
      - name: Put pinned toolchain on PATH
        run: echo "$HOME/.rustup/toolchains/nightly-2025-08-01-x86_64-unknown-linux-gnu/bin" >> "$GITHUB_PATH"
      - name: Fetch locked adapter registry sources
        run: cargo fetch --manifest-path crates/nagi-calendar-search-adapter/Cargo.toml --locked
      - name: Fetch only the locked SearchCore git pin
        run: cargo fetch --manifest-path crates/nagi-search-core/Cargo.toml --locked
      - name: Assert pinned and local canonical type graphs
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess

          def metadata(manifest):
              return json.loads(subprocess.check_output([
                  "cargo", "metadata", "--format-version", "1",
                  "--locked", "--offline", "--manifest-path", manifest
              ], text=True))

          adapter = metadata("crates/nagi-calendar-search-adapter/Cargo.toml")["packages"]
          expected_paths = {
              "nagi-model": pathlib.Path("crates/nagi-model/Cargo.toml").resolve(),
              "nagi-search": pathlib.Path("user/nagi-search/Cargo.toml").resolve(),
          }
          for name, expected_path in expected_paths.items():
              found = [p for p in adapter if p["name"] == name]
              assert len(found) == 1, f"adapter graph has {len(found)} {name} packages"
              assert found[0]["source"] is None, f"adapter {name} is not a local path package"
              assert pathlib.Path(found[0]["manifest_path"]).resolve() == expected_path, found[0]["manifest_path"]

          pinned = metadata("crates/nagi-search-core/Cargo.toml")["packages"]
          revision = "de3092c6a0125e45ea0b1f5f70c6d62c0c33f7fa"
          for name in ("nagi-model", "nagi-search"):
              found = [p for p in pinned if p["name"] == name]
              assert len(found) == 1, f"pinned graph has {len(found)} {name} packages"
              source = found[0]["source"] or ""
              assert source.endswith("#" + revision), f"{name} is not pinned to {revision}: {source}"
          print("PASS: adapter uses one local canonical model/search package; SearchCore uses one exact git-pinned pair")
          PY
      - name: Package format
        run: cargo fmt --manifest-path "${{ matrix.manifest }}" -p "${{ matrix.package }}" -- --check
      - name: Package warnings-denied Clippy
        run: cargo clippy --manifest-path "${{ matrix.manifest }}" -p "${{ matrix.package }}" --all-targets --locked --offline -- -D warnings
      - name: Package host tests
        run: cargo test --manifest-path "${{ matrix.manifest }}" -p "${{ matrix.package }}" --all-targets --locked --offline
