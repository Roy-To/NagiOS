name: Nagi Identity Session Host Contract

on:
  pull_request:
    paths:
      - ".github/workflows/nagi-identity-session.yml"
      - "crates/nagi-capability/**"
      - "crates/nagi-identity-session/**"
      - "crates/nagi-model/**"
      - "rust-toolchain.toml"
      - "tests/identity-session/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/nagi-identity-session.yml"
      - "crates/nagi-capability/**"
      - "crates/nagi-identity-session/**"
      - "crates/nagi-model/**"
      - "rust-toolchain.toml"
      - "tests/identity-session/**"

permissions:
  contents: read

jobs:
  identity-session:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install nightly-2025-08-01 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo +nightly-2025-08-01 fmt --manifest-path crates/nagi-identity-session/Cargo.toml -- --check
      - name: Clippy
        run: cargo +nightly-2025-08-01 clippy --manifest-path crates/nagi-identity-session/Cargo.toml --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo +nightly-2025-08-01 test --manifest-path crates/nagi-identity-session/Cargo.toml --all-targets --locked
