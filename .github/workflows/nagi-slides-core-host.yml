name: Nagi Slides Core host

on:
  push:
    branches: [main]
    paths:
      - 'crates/nagi-slides-core/**'
      - 'tests/slides-core/**'
      - 'crates/nagi-model/**'
      - 'user/nagi-history/**'
      - '.cargo/**'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - '.rustfmt.toml'
      - 'clippy.toml'
      - '.github/workflows/nagi-slides-core-host.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/nagi-slides-core/**'
      - 'tests/slides-core/**'
      - 'crates/nagi-model/**'
      - 'user/nagi-history/**'
      - '.cargo/**'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - '.rustfmt.toml'
      - 'clippy.toml'
      - '.github/workflows/nagi-slides-core-host.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nagi-slides-core-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slides-core-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned Rust toolchain
        run: rustup toolchain install nightly-2025-08-01 --profile minimal --component rustfmt --component clippy

      - name: Fetch locked standalone dependencies
        run: cargo +nightly-2025-08-01 fetch --manifest-path crates/nagi-slides-core/Cargo.toml --locked

      - name: Check formatting
        run: cargo +nightly-2025-08-01 fmt --manifest-path crates/nagi-slides-core/Cargo.toml --package nagi-slides-core -- --check

      - name: Run Clippy
        run: cargo +nightly-2025-08-01 clippy --manifest-path crates/nagi-slides-core/Cargo.toml --all-targets --locked --offline -- -D warnings

      - name: Run standalone Slides Core tests
        run: cargo +nightly-2025-08-01 test --manifest-path crates/nagi-slides-core/Cargo.toml --locked --offline
