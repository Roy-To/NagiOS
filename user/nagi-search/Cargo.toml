[package]
name = "nagi-search"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
nagi-model = { path = "../../crates/nagi-model" }

# Host-only read adapter; reuse the workspace's existing pinned libc version.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = { version = "=0.2.189", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("nagi"))'] }
