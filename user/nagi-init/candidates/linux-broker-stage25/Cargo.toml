nagi-package = { path = "../../../nagi-package" }
nagi-init-service-call = { path = "../../../../crates/nagi-init-service-call" }
nagi-sdk = { path = "../../../../sdk/rust" }
nagi-service-contract = { path = "../../../../crates/nagi-service-contract" }
