[package]
name = "nagi-init"
version = "0.1.0"
edition = "2021"
build = "build.rs"
publish = false

[features]
linux-files-desktop = [
    "dep:nagi-files",
    "dep:nagi-files-c1-session-consumer",
    "nagi-files-c1-session-consumer/c1-issued-session",
]
system-service-readiness = []
production-session = []
linux-service-action-bridge = [
    "dep:nagi-action-ipc",
    "dep:nagi-init-service-call",
    "dep:nagi-service-contract",
]
m8-shell = []
m9-window = []
m10-desktop = []
m11-security = []
m12-network = []
m13-posix = ["m12-network"]
m13-std = []
m14-audio = ["m13-posix"]
m15-history = ["m14-audio"]
m16-package = ["m15-history"]
# Persistent, owner-scoped Search runtime used by the ordinary signed-in
# desktop. The acceptance harness adds its separate fixtures and IPC clients.
m19-runtime = [
    "dep:nagi-search",
    "dep:nagi-search-ipc",
]
# ADR 0043: spawn the isolated app ELF named by NAGI_ISOLATED_APP_ELF and
# verify kernel-stamped caller identity and address-space isolation.
isolated-process-acceptance = []
m27-ro-vfs-check = []
m27-recovery = []
m27-recovery-undo-acceptance = ["m27-recovery"]
m29-settings-acceptance = ["m10-desktop"]
# ADR 0060: the desktop's OS-owned consent dialog answers a signed
# acceptance application's grant request; needs NAGI_ACCEPTANCE_PACKAGES.
consent-dialog = ["m10-desktop"]
consent-dialog-acceptance = ["consent-dialog"]
# ADR 0063: first-run owner account and lock-screen sign-in before the
# desktop and its readiness report.
desktop-login = ["m10-desktop", "m19-runtime"]
desktop-login-acceptance = ["desktop-login"]
# ADR 0069: route normal Files panel searches through one signed product client.
m19-files-search-production = ["desktop-login", "consent-dialog", "dep:nagi-search-ipc"]
# ADR 0066: keep the login acceptance input loop active until a password
# change is saved, so the host can verify the persisted credential on reboot.
desktop-password-change-acceptance = ["desktop-login-acceptance"]
# ADR 0062: install a signed system update into the inactive slot and stage
# it for a trial on the next boot.
m30-update-install = ["dep:nagi-fat32", "dep:nagi-slot-manifest"]
m25-voice-acceptance = []

[[bin]]
name = "nagi-init"
path = "src/main.rs"
test = true
bench = false

[dependencies]
libnagi = { path = "../libnagi" }
nagi-audio = { path = "../nagi-audio" }
nagi-history = { path = "../nagi-history" }
nagi-model = { path = "../../crates/nagi-model" }
nagi-fat32 = { path = "../../crates/nagi-fat32", optional = true }
nagi-slot-manifest = { path = "../../crates/nagi-slot-manifest", optional = true }
nagi-clipboard = { path = "../nagi-clipboard", optional = true }
nagi-model-manager = { path = "../nagi-model-manager", optional = true }
nagi-localization = { path = "../nagi-localization" }
nagi-package = { path = "../nagi-package" }
nagi-init-package-provider = { path = "../nagi-init-package-provider" }
nagi-sdk = { path = "../../sdk/rust" }
nagi-ui = { path = "../nagi-ui" }
nagi-net = { path = "../nagi-net" }
nagi-pal = { path = "../nagi-pal" }
nagi-posix = { path = "../nagi-posix" }
nagi-search = { path = "../nagi-search", optional = true }
nagi-search-ipc = { path = "../../crates/nagi-search-ipc", optional = true }
nagi-action-ipc = { path = "../../crates/nagi-action-ipc", optional = true }
nagi-init-service-call = { path = "../../crates/nagi-init-service-call", optional = true }
nagi-service-contract = { path = "../../crates/nagi-service-contract", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
nagi-files = { path = "../../apps/nagi-files", optional = true }
nagi-files-c1-session-consumer = { path = "../../tools/nagi-files-c1-session-consumer", optional = true }
nagi-abi = { path = "../../crates/nagi-abi" }
nagi-account-credential = { path = "../../crates/nagi-account-credential" }
nagi-calendar-core = { path = "../../crates/nagi-calendar-core" }
nagi-calendar-input-adapter = { path = "../../crates/nagi-calendar-input-adapter" }
nagi-persistence-contract = { path = "../../crates/nagi-persistence-contract" }
libc = "=0.2.189"
linux-peer-credentials-supplier = { path = "candidates/linux-broker-stage25/stage25/task39-contract-overlay" }
nagi-dev-service-catalog-consumer = { path = "candidates/linux-broker-stage25/stage25/task25-contract-overlay" }
nagi-task37-receipt-supplier = { path = "candidates/linux-broker-stage25/stage25/task37-contract-overlay" }
nagi-nipc-v1-stream-candidate = { package = "nagi-nipc-v1-stream", path = "../../crates/nagi-nipc-v1-stream" }
zeroize = { version = "=1.9.0", features = ["alloc"] }
e-profile-root-canonical-consumer = { path = "../../tools/auth-notes-profile-root-consumer-20261118" }
notes-event-bridge-candidate = { path = "../../tools/linux-boot/notes-desktop-dev-20261116/notes-event-bridge" }
notes-files-codec-candidate = { path = "../../tools/linux-boot/notes-desktop-dev-20261116/notes-codec" }
nagi-identity-session = { path = "../../crates/nagi-identity-session", features = ["linux-interactive-account", "system-service-recovery-contract"] }
nagi-peer-authenticated-connection = { path = "../../crates/nagi-peer-authenticated-connection" }
nagi-c2-accepted-connection-proof-contract = { path = "../../crates/nagi-c2-accepted-connection-proof-contract", features = ["c2-issuer"] }
nagi-init-spawn-contract = { path = "../../crates/nagi-init-spawn-contract" }
nagi-linux-account-verifier = { path = "../nagi-linux-account-verifier" }
nagi-profile-volume-notes-owner = { path = "../../crates/nagi-profile-volume-owner" }
nagi-system-principal-contract = { path = "../../crates/nagi-system-principal-contract" }
nagi-system-service-recovery-contract = { path = "../../crates/nagi-system-service-recovery-contract" }
nagi-system-service-launch = { path = "../../crates/nagi-system-service-launch" }
rustix = { version = "=1.1.4", default-features = false, features = ["std", "fs"] }
serde_json = "1"
sha2 = { version = "=0.10.9", default-features = false }

[target.'cfg(target_os = "linux")'.dev-dependencies]
nagi-init-spawn-contract = { path = "../../crates/nagi-init-spawn-contract", features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
nagi-account-credential = { path = "../../crates/nagi-account-credential" }
nagi-calendar-core = { path = "../../crates/nagi-calendar-core" }
nagi-persistence-contract = { path = "../../crates/nagi-persistence-contract" }
serde_json = "1"

[dev-dependencies]
notes-event-bridge-candidate = { path = "../../tools/linux-boot/notes-desktop-dev-20261116/notes-event-bridge" }
notes-files-codec-candidate = { path = "../../tools/linux-boot/notes-desktop-dev-20261116/notes-codec" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("nagi"))'] }

[workspace]
exclude = ["candidates/linux-broker-stage25"]
resolver = "2"
