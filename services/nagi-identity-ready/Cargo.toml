[package]
name = "nagi-identity-ready"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "nagi-identity-ready"
path = "src/main.rs"
test = false
bench = false

[dependencies]
libc = "=0.2.189"
nagi-sdk = { path = "../../sdk/rust" }

[profile.release]
opt-level = "z"
panic = "abort"
lto = true
strip = true
codegen-units = 1
