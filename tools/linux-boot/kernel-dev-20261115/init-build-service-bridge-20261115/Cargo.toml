[package]
name = "nagi-init"
version = "0.1.0"
edition = "2021"
build = "../../../../user/nagi-init/build.rs"
publish = false

[features]
default = []
production-session = []
linux-service-action-bridge = [
    "dep:nagi-action-ipc",
    "dep:nagi-init-service-call",
    "dep:nagi-service-contract",
]
m8-shell = []
m9-window = []
m10-desktop = []
m11-security = []
m12-network = []
m13-posix = []
m13-std = []
m14-audio = []
m15-history = []
m16-package = []
m17-servo = []
m18-acceptance = []
m19-search = []
m19-search-ipc = []
m21-action-ipc = []
m20-model-store-acceptance = []
m20-fixture-acceptance = []
m20-granite-artifact-acceptance = []
m20-llama-link-smoke = []
m20-llama-inference-acceptance = []
m22-history = []
isolated-process-acceptance = []
m27-ro-vfs-check = []
m27-recovery = []
m27-recovery-undo-acceptance = []
m29-settings-acceptance = []
m25-voice-acceptance = []
m25-whisper-artifact-acceptance = []
m25-whisper-inference-acceptance = []
m26-qwen-artifact-acceptance = []
m26-gemma-artifact-acceptance = []

[[bin]]
name = "nagi-init"
path = "../../../../user/nagi-init/src/main.rs"
test = true
bench = false

[dependencies]
libnagi = { path = "../../../../user/libnagi" }
nagi-audio = { path = "../../../../user/nagi-audio" }
nagi-history = { path = "../../../../user/nagi-history" }
nagi-model = { path = "../../../../crates/nagi-model" }
nagi-localization = { path = "../../../../user/nagi-localization" }
nagi-package = { path = "../../../../user/nagi-package" }
nagi-init-package-provider = { path = "../../../../user/nagi-init-package-provider" }
nagi-sdk = { path = "../../../../sdk/rust" }
nagi-ui = { path = "../../../../user/nagi-ui" }
nagi-net = { path = "../../../../user/nagi-net" }
nagi-pal = { path = "../../../../user/nagi-pal" }
nagi-posix = { path = "../../../../user/nagi-posix" }
nagi-action-ipc = { path = "../../../../crates/nagi-action-ipc", optional = true }
nagi-init-service-call = { path = "../../../../crates/nagi-init-service-call", optional = true }
nagi-service-contract = { path = "../../../../crates/nagi-service-contract", optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(target_os, values(\"nagi\"))"] }

[patch.crates-io]
cc = { path = "../../../../third_party/cc-nagi" }
libc = { path = "../../../../third_party/libc-servo" }
freetype-sys = { path = "../../../../third_party/freetype-sys" }
hyper-util = { path = "../../../../third_party/hyper-util-servo" }
inventory = { path = "../../../../third_party/inventory-nagi" }
mio = { path = "../../../../third_party/mio-servo" }
socket2 = { path = "../../../../third_party/socket2-servo" }
tempfile = { path = "../../../../third_party/tempfile-nagi" }
mozjs_sys = { path = "../../../../third_party/mozjs-sys-nagi" }
tokio = { path = "../../../../third_party/tokio-servo" }
surfman = { path = "../../../../third_party/surfman" }

[workspace]
