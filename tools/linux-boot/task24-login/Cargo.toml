[package]
name = "nagi-task24-login"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "task24-login"
path = "main.rs"

[dependencies]
libc = "=0.2.189"
libnagi = { path = "../../../user/libnagi" }
nagi-sdk = { path = "../../../sdk/rust" }
zeroize = { version = "=1.9.0", default-features = false }

[profile.release]
opt-level = "z"
panic = "abort"
lto = true
strip = true
codegen-units = 1
