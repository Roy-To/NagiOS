[package]
name = "nagi-c1-session-runtime"
version = "0.1.0"
edition = "2021"
publish = false
# durable_auth.rs is included by nagi-identity-session's cfg(test) harness so
# fixtures can use its crate-private seals without exposing them to consumers.
# Run all C1 scenarios with cargo test --manifest-path
# crates/nagi-identity-session/Cargo.toml; keep external discovery disabled.
autotests = false

[workspace]
resolver = "2"

[dependencies]
getrandom = "=0.4.3"
libnagi = { path = "../../user/libnagi" }
nagi-identity-session = { path = "../nagi-identity-session" }

[dev-dependencies]
serde_json = "1.0"
