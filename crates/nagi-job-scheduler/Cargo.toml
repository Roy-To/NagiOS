[package]
name = "nagi-job-scheduler"
version = "0.2.0"
edition = "2021"
publish = false

[features]
default = []
linux-development-runtime = ["dep:rustix", "dep:sha2"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "std", "time"], optional = true }
sha2 = { version = "=0.10.9", default-features = false, optional = true }
