[package]
name = "nagi-system-service-recovery-contract"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
sha2 = { version = "0.10.9", default-features = false }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
ed25519-dalek = { version = "=2.1.1", default-features = false }
nagi-package = { path = "../../user/nagi-package" }
nagi-system-principal-contract = { path = "../nagi-system-principal-contract" }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("nagi"))'] }
