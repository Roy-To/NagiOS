[package]
name = "nagi-system-service-launch"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
nagi-capability = { path = "../nagi-capability" }
nagi-identity-session = { path = "../nagi-identity-session" }
nagi-init-spawn-contract = { path = "../nagi-init-spawn-contract" }
nagi-init-package-provider = { path = "../../user/nagi-init-package-provider" }
nagi-model = { path = "../nagi-model" }
nagi-package = { path = "../../user/nagi-package" }
nagi-service-contract = { path = "../nagi-service-contract" }
nagi-system-principal-contract = { path = "../nagi-system-principal-contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"

[dev-dependencies]
ed25519-dalek = { version = "=2.1.1", default-features = false }

[workspace]
members = ["."]
resolver = "2"
