[workspace]
resolver = "2"
members = [
    "tools/nagi-cli",
    "tools/nagi-idl",
    "crates/nagi-abi",
    "crates/nagi-model",
    "crates/nagi-account-credential",
    "crates/nagi-i18n",
    "crates/nagi-action-ipc",
    "crates/nagi-search-ipc",
    "crates/nagi-job-scheduler",
    "crates/nagi-slot-manifest",
    "crates/nagi-data-boot-selection",
    "crates/nagi-system-service-recovery-contract",
    "user/libnagi",
    "user/nagi-net",
    "user/nagi-pal",
    "user/nagi-posix",
    "user/nagi-audio",
    "user/nagi-history",
    "user/nagi-package",
    "user/nagi-model-manager",
    "user/nagi-ui",
    "user/nagi-localization",
    "user/nagi-clipboard",
    "user/nagi-ime",
    "user/nagi-search",
    "services/nagi-ai",
    "user/nagi-init-package-provider",
    "user/nagi-linux-account-verifier",
    "user/nagi-init-linux-tests",
    "user/nagi-albert-linux-tests",
    "user/nagi-isolated-app",
]
default-members = [
    "tools/nagi-cli",
]
exclude = [
    # These standalone packages have their own Cargo workspaces. They are
    # consumed by path from the Linux init integration crates, but must not
    # also be discovered as nested members of the repository workspace.
    "crates/nagi-capability",
    "crates/nagi-calendar-core",
    "crates/nagi-calendar-input-adapter",
    "crates/nagi-identity-session",
    "crates/nagi-init-spawn-contract",
    "crates/nagi-system-principal-contract",
    "crates/nagi-system-service-launch",
    "crates/nagi-service-contract",
    "crates/nagi-nipc-v1-stream",
    "crates/nagi-init-service-call",
    "crates/nagi-profile-volume-owner",
    "crates/nagi-persistence-contract",
    # This standalone app workspace is a path dependency of the Notes codec.
    "apps/nagi-files",
    # Linux host tests use sibling manifests over the product sources.
    # The legacy update fixture is still optional in the product manifest.
    "crates/nagi-fat32",
    "user/nagi-init",
    "user/nagi-albert",
    "tools/linux-boot/kernel-dev-20261115/package-identity-negative-20261115",
]
