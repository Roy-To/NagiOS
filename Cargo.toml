[workspace]
resolver = "2"
members = [
    "tools/nagi-cli",
    "tools/nagi-idl",
    "crates/nagi-bootinfo",
    "crates/nagi-abi",
    "crates/nagi-model",
    "crates/nagi-i18n",
    "crates/nagi-action-ipc",
    "crates/nagi-search-ipc",
    "crates/nagi-job-scheduler",
    "crates/nagi-slot-manifest",
    "crates/nagi-fat32",
    "kernel",
    "user/libnagi",
    "user/nagi-net",
    "user/nagi-pal",
    "user/nagi-posix",
    "user/nagi-audio",
    "user/nagi-history",
    "user/nagi-package",
    "user/nagi-model-manager",
    "user/nagi-ui",
    "user/nagi-localization",
    "user/nagi-clipboard",
    "user/nagi-ime",
    "user/nagi-search",
    "services/nagi-ai",
    "user/nagi-servo",
    "user/nagi-init-package-provider",
    "user/nagi-init-linux-tests",
    "user/nagi-isolated-app",
]
default-members = [
    "tools/nagi-cli",
    "crates/nagi-bootinfo",
]
exclude = [
    "third_party/relibc",
    "third_party/servo",
    # These standalone packages have their own Cargo workspaces. They are
    # consumed by path from the Linux init integration crates, but must not
    # also be discovered as nested members of the repository workspace.
    "crates/nagi-capability",
    "crates/nagi-service-contract",
    "crates/nagi-nipc-v1-stream",
    "crates/nagi-init-service-call",
    # The product PID 1 manifest retains its Nagi-only Albert/Servo graph.
    # Linux unit tests use the sibling manifest at user/nagi-init-linux-tests
    # with the same source/build script but without target_os=nagi dependencies.
    # Keeping the product manifest outside root resolution avoids requiring
    # the Servo export just to load the Linux test package.
    "user/nagi-init",
    "tools/linux-boot/kernel-dev-20261115/package-identity-negative-20261115",
]
