[package]
name = "nagi-desktop-lock-host-tests"
version = "0.1.0"
edition = "2021"
build = "../build.rs"
publish = false

[workspace]
members = ["libnagi"]

[features]
default = ["m20-model-service"]
m20-model-service = ["production-session", "dep:nagi-model-manager", "dep:nagi-ai"]
production-session = ["desktop-login", "m19-files-search-production"]
desktop-login = ["m10-desktop", "m19-runtime"]
m10-desktop = []
m19-runtime = ["dep:nagi-search", "dep:nagi-search-ipc"]
m19-files-search-production = ["desktop-login", "consent-dialog", "dep:nagi-search-ipc"]
desktop-login-acceptance = ["desktop-login"]
consent-dialog = []

[dependencies]
nagi-action-ipc = { path = "../../../crates/nagi-action-ipc" }
nagi-ai = { path = "../../../services/nagi-ai", optional = true }
libnagi = { package = "nagi-desktop-host-libnagi", path = "libnagi" }
nagi-model-manager = { path = "../../../user/nagi-model-manager", optional = true }
nagi-model = { path = "../../../crates/nagi-model" }
nagi-localization = { path = "../../../user/nagi-localization" }
nagi-ui = { path = "../../../user/nagi-ui" }
nagi-package = { path = "../../../user/nagi-package" }
nagi-search = { path = "../../../user/nagi-search", optional = true }
nagi-search-ipc = { path = "../../../crates/nagi-search-ipc", optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("nagi"))'] }
